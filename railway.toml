# Single-service deploy: API + built React app (same origin → /api works).
# Railway → Settings → Root Directory: repo root (empty / ".")

[build]
builder = "NIXPACKS"
buildCommand = "npm run install:all && npm run build:web"

[deploy]
startCommand = "npm run start:backend"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
